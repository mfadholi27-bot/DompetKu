name: Publish DompetKu preview

on:
  push:
    branches:
      - commercial-development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dompetku-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published main version
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          persist-credentials: false

      - name: Checkout commercial development into preview folder
        uses: actions/checkout@v4
        with:
          ref: commercial-development
          path: site/preview
          persist-credentials: false

      - name: Prepare Pages artifact
        run: touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
